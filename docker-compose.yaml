services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-backend
    env_file:
      - .env
    depends_on:
      - redis
      - fluent-bit
    ports:
      - "8000:8000"
    networks:
      - app-network
    restart: always
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: home-app.api

  redis:
    image: redis:7
    container_name: redis-cache
    restart: always
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    restart: always
    env_file:
      - .env
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - prometheus-data:/prometheus
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sed "s/[$$]{ADMIN_USERNAME}/$$ADMIN_USERNAME/g; s/[$$]{ADMIN_PASSWORD}/$$ADMIN_PASSWORD/g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.console.libraries=/etc/prometheus/console_libraries \
          --web.console.templates=/etc/prometheus/consoles \
          --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - app-network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${ADMIN_USERNAME:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - prometheus

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: opensearch
    restart: always
    env_file:
      - .env
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # OpenSearch's security plugin has one fixed built-in user, "admin" -
      # only its password can be set, so it borrows ADMIN_PASSWORD (same
      # password already used for Grafana/Prometheus) instead of needing a
      # new secret.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - app-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: opensearch-dashboards
    restart: always
    env_file:
      - .env
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${ADMIN_PASSWORD}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5601:5601"
    networks:
      - app-network
    depends_on:
      - opensearch

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: fluent-bit
    restart: always
    env_file:
      - .env
    volumes:
      - ./monitoring/fluent-bit/fluent-bit.prod.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./monitoring/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    ports:
      - "127.0.0.1:24224:24224"
    networks:
      - app-network
    depends_on:
      - opensearch

networks:
  app-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  opensearch-data:
